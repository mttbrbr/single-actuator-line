project:
  name: phaseVI_single_turbine_IDDES
  openfoam_version: v2412

turbine:
  diameter: 10.058
  radius: 5.029
  hub_height: 12.192
  rotor_speed_rpm: 71.63
  pitch_deg: 3.0
  n_blades: 2
  n_elements: 50
  tip_speed_ratio: 5.3894
  axis: [-1.0, 0.0, 0.0]
  vertical_direction: [0.0, 0.0, 1.0]
  gaussian_mesh_factor: 1.0
  dynamic_stall: false
  position_D: [0.0, 0.0]

domain_D:
  x: [-5.0, 15.0]
  y: [-4.0, 4.0]
  z: [0.0, 5.0]

mesh:
  # Change only this value to choose the core resolution. 48 = current 22.5M
  # case; 32 = 6.67M cells. 49 is under, 50 exceeds the 25M-cell budget.
  cells_per_D: 48
  reference_cells_per_D: 48
  max_cells: 25000000
  x:
    breaks_D: [-5.0, -0.5, 8.0, 15.0]
    cells: [75, 408, 90]
    grading: [0.160029, 1.0, 9.252929]
  y:
    breaks_D: [-4.0, -1.5, 1.5, 4.0]
    cells: [54, 144, 54]
    grading: [0.241240, 1.0, 4.145249]
  z:
    breaks_D: [0.0, 2.0, 5.0]
    cells: [96, 60]
    grading: [1.0, 4.691804]

abl:
  hub_velocity: 7.0
  roughness_length: 0.03
  von_karman: 0.41
  turbulence_intensity: 0.10
  kinematic_viscosity: 1.5e-5

mann:
  seed: 20260715
  gamma: 3.9
  length_scale_D: 0.7
  high_frequency_compensation: 0
  duration: 57.7
  sample_dt: 0.1
  # D/16 transverse sampling: three inlet samples across each D/48 core cell.
  dy_D: 0.0625
  dz_D: 0.0625
  double_xyz: [false, true, true]
  n_cpu: 1

run:
  end_time: 57.5
  statistics_start: 28.75
  initial_delta_t: 0.03
  max_delta_t: 0.035
  max_courant: 1.0
  write_interval: 0.5
  # Keep every checkpoint for reproducible full-run videos and diagnostics.
  # This can require hundreds of GB; monitor free disk space.
  purge_write: 0
  n_processors: 12

smoke:
  end_time: 0.25
  max_courant: 0.8
  n_processors: 4
  cells:
    x: [10, 34, 12]
    y: [8, 24, 8]
    z: [16, 10]
