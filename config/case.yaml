project:
  name: phaseVI_single_turbine_IDDES
  openfoam_version: v2412

turbine:
  diameter: 10.058
  radius: 5.029
  hub_height: 12.192
  rotor_speed_rpm: 71.63
  pitch_deg: 3.0
  n_blades: 2
  n_elements: 50
  tip_speed_ratio: 5.3894
  axis: [-1.0, 0.0, 0.0]
  vertical_direction: [0.0, 0.0, 1.0]
  gaussian_mesh_factor: 1.0
  dynamic_stall: false
  position_D: [0.0, 0.0]

domain_D:
  x: [-5.0, 15.0]
  y: [-4.0, 4.0]
  z: [0.0, 5.0]

mesh:
  x:
    breaks_D: [-5.0, -0.5, 8.0, 15.0]
    cells: [75, 408, 90]
    grading: [0.160029, 1.0, 9.252929]
  y:
    breaks_D: [-4.0, -1.5, 1.5, 4.0]
    cells: [54, 144, 54]
    grading: [0.241240, 1.0, 4.145249]
  z:
    breaks_D: [0.0, 2.0, 5.0]
    cells: [96, 60]
    grading: [1.0, 4.691804]
  target_cells: [22400000, 22700000]

abl:
  hub_velocity: 7.0
  roughness_length: 0.03
  von_karman: 0.41
  turbulence_intensity: 0.10
  kinematic_viscosity: 1.5e-5

mann:
  seed: 20260715
  gamma: 3.9
  length_scale_D: 0.7
  high_frequency_compensation: 0
  duration: 57.7
  sample_dt: 0.1
  dy_D: 0.125
  dz_D: 0.125
  double_xyz: [false, true, true]
  n_cpu: 1

run:
  end_time: 57.5
  statistics_start: 28.75
  initial_delta_t: 0.03
  max_delta_t: 0.035
  max_courant: 1.0
  write_interval: 0.5
  purge_write: 64
  n_processors: 12

visualization:
  # Render saved fields after the CFD run.  In-solver VTK/X11 rendering makes
  # the MPI calculation depend on a live desktop session and can abort it.
  enabled: false
  write_control: writeTime
  write_interval: 1
  # Cinematic aspect ratio matched to the physical extent below.  Keeping the
  # two ratios equal prevents VTK from letterboxing the sampled plane.
  image_size: [3840, 1440]
  horizontal_offsets_D: [-0.25, 0.0, 0.25]
  view_D:
    x: [-0.5, 7.5]
    y: [-1.5, 1.5]
  cross_sections_D: [1, 2, 4, 6, 8]
  cross_image_size: [3840, 1920]
  cross_view_D:
    y: [-1.5, 1.5]
    z_offset: [-0.75, 0.75]
  cross_fields: [velocity, vorticity]
  fields:
    velocity:
      field: U
      range: [4.0, 8.5]
      title: "|U| [m/s]"
      colour_map: coolToWarm
    vorticity:
      field: vorticity
      range: [0.0, 2.0]
      title: "|vorticity| [1/s]"
      colour_map: fire
    pressure_coefficient:
      field: Cp
      range: [-0.4, 0.8]
      title: "Cp [-]"
      colour_map: coolToWarm
    q_criterion:
      field: Q
      range: [0.0, 0.5]
      title: "Q [1/s2]"
      colour_map: coolToWarm

smoke:
  end_time: 0.25
  max_courant: 0.8
  n_processors: 4
  cells:
    x: [10, 34, 12]
    y: [8, 24, 8]
    z: [16, 10]
